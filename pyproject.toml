[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsh-zotero-academic-engine"
version = "1.0.0"
description = "Zotero Academic & Semantic Search Engine for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyzotero>=1.14.0",
    "python-dotenv>=1.0.0",
    "pdf-inspector==0.2.6",
    "markdownify>=1.2",
    "markdown-it-py>=2.2",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "httpx>=0.27",
    "unidecode>=1.3.0",
    "bibtexparser>=1.4,<2",
    "chromadb>=1.0.0",
    "sentence-transformers>=2.2.0",
    "pymupdf>=1.24.2",
    "ebooklib>=0.18",
]

[project.scripts]
zotero-engine = "engine.server:main"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
